# Render Blueprint: tạo Web Service (Docker) + PostgreSQL miễn phí
services:
  - type: web
    name: minijudge
    runtime: docker
    plan: free
    healthCheckPath: /accounts/login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SEED_DEMO
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: minijudge-db
          property: connectionString

databases:
  - name: minijudge-db
    plan: free
